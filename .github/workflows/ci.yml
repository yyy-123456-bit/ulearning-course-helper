name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装开发依赖
        run: npm install --no-audit --no-fund

      - name: 语法检查
        run: npm run check

      - name: 元数据校验
        run: node scripts/check-metadata.js

      - name: 冒烟测试（jsdom）
        run: node test-smoke.js
