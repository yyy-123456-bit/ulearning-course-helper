name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 元数据校验（tag 必须与 @version 一致）
        run: |
          node scripts/check-metadata.js
          TAG="${GITHUB_REF_NAME#v}"
          # 注意：脚本头里 @version 后面有多个空格，不能用 (?<=@version\s) 这种定长后行断言
          VER=$(sed -n 's|^//[[:space:]]*@version[[:space:]]\{1,\}\([0-9][0-9.]*\).*|\1|p' ulearning-course-helper.user.js | head -n1)
          echo "tag=$TAG version=$VER"
          if [ -z "$VER" ]; then
            echo "::error::未能从脚本头解析出 @version"
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ($TAG) 与 @version ($VER) 不一致"
            exit 1
          fi

      - name: 生成校验和
        run: sha256sum ulearning-course-helper.user.js > ulearning-course-helper.user.js.sha256

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ulearning-course-helper.user.js \
            ulearning-course-helper.user.js.sha256
